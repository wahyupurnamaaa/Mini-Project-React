<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App - Tugas 7</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-10">

  <div class="max-w-lg mx-auto px-4">
    <h1 class="text-3xl font-bold text-center text-indigo-700 mb-8">📝 My Todo App</h1>

    <!-- Input Todo -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <div class="flex gap-2">
        <input
          type="text"
          id="todoInput"
          placeholder="Tambah todo baru..."
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          onkeypress="if(event.key==='Enter') addTodo()"
        >
        <button
          onclick="addTodo()"
          class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium"
        >
          Tambah
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex justify-center gap-8 mb-6">
      <div class="bg-white rounded-lg shadow px-6 py-3 text-center">
        <p class="text-gray-500 text-sm">Total Todos</p>
        <p id="totalTodos" class="text-2xl font-bold text-indigo-600">0</p>
      </div>
      <div class="bg-white rounded-lg shadow px-6 py-3 text-center">
        <p class="text-gray-500 text-sm">Completed</p>
        <p id="completedTodos" class="text-2xl font-bold text-green-600">0</p>
      </div>
    </div>

    <!-- Todo List -->
    <ul id="todoList" class="space-y-3">
    </ul>
  </div>

  <script>
    let todos = [];

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();

      if (text) {
        todos.push({
          id: Date.now(),
          text: text,
          completed: false
        });
        input.value = '';
        renderTodos();
      }
    }

    function toggleTodo(id) {
      todos = todos.map(todo =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      renderTodos();
    }

    function renderTodos() {
      const list = document.getElementById('todoList');
      const totalSpan = document.getElementById('totalTodos');
      const completedSpan = document.getElementById('completedTodos');

      list.innerHTML = todos.map(todo => `
        <li class="bg-white rounded-lg shadow p-4 flex items-center gap-4">
          <input
            type="checkbox"
            ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id})"
            class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
          >
          <span
            class="flex-1 cursor-pointer ${todo.completed ? 'line-through text-gray-400' : 'text-gray-700'}"
            onclick="toggleTodo(${todo.id})"
          >
            ${todo.text}
          </span>
          <button
            onclick="deleteTodo(${todo.id})"
            class="text-red-500 hover:text-red-700 font-medium px-3 py-1 rounded hover:bg-red-50 transition-colors"
          >
            Hapus
          </button>
        </li>
      `).join('');

      totalSpan.textContent = todos.length;
      completedSpan.textContent = todos.filter(t => t.completed).length;
    }
  </script>

</body>
</html>
